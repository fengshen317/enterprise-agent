name: 发布和部署 enterprise-agent

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/production-release.yml
      - backend/**
      - frontend/**
      - compose*.yaml
      - deploy/production/**
      - deploy/tests/**
      - deploy/ragflow/**
      - deploy/init-service-passwords.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: enterprise-agent-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 构建和发布应用镜像
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 发布 GHCR 镜像及同版本部署配置
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir/deploy"
          cp compose.yaml compose.funnel.yaml compose.report.yaml compose.release.yaml "$release_dir/"
          cp deploy/init-service-passwords.py "$release_dir/deploy/"
          cp -R deploy/ragflow "$release_dir/deploy/"
          printf '%s\n' "$GITHUB_SHA" > "$release_dir/source-revision"

          for service in api web; do
            if [[ "$service" == api ]]; then
              context=backend
            else
              context=frontend
            fi
            image="ghcr.io/${GITHUB_REPOSITORY,,}-release-test-$service"
            tag="$image:main-$GITHUB_SHA-$GITHUB_RUN_ATTEMPT"
            metadata="$RUNNER_TEMP/$service-image.json"
            docker buildx build --platform linux/amd64 --push --tag "$tag" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --metadata-file "$metadata" "$context"
            digest="$(jq -er '."containerimage.digest" | select(test("^sha256:[0-9a-f]{64}$"))' "$metadata")"
            printf 'EA_RELEASE_%s_IMAGE=%s@%s\n' "${service^^}" "$image" "$digest" >> "$release_dir/release.env"
          done
          bash deploy/production/base-fingerprint.sh > "$release_dir/deployment-base"
          tar -czf "$RUNNER_TEMP/production-release.tar.gz" -C "$release_dir" .

      - name: 保存发布包
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-release
          path: ${{ runner.temp }}/production-release.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  rehearse:
    name: 拉取镜像并演练升级和恢复
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 下载发布包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-release
          path: ${{ runner.temp }}/release-download

      - name: 使用正式镜像入口完成升级和恢复
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          tar -xzf "$RUNNER_TEMP/release-download/production-release.tar.gz" -C "$release_dir"
          bash deploy/tests/release-rehearsal.sh "$release_dir"

  deploy:
    name: 更新正式服务
    needs: rehearse
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: deploy-production
    permissions:
      id-token: write
    steps:
      - name: 下载已验收发布包
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: production-release
          path: ${{ runner.temp }}/release-download

      - name: 加入生产部署私网
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TAILSCALE_OIDC_CLIENT_ID }}
          audience: ${{ vars.TAILSCALE_OIDC_AUDIENCE }}
          tags: tag:enterprise-agent-actions-check
          ping: ${{ secrets.EA_PROD_SSH_HOST }}

      - name: 请求部署机执行备份、切换和验收
        shell: bash
        env:
          SSH_HOST: ${{ secrets.EA_PROD_SSH_HOST }}
          SSH_USER: ${{ secrets.EA_PROD_SSH_USER }}
          SSH_KEY: ${{ secrets.EA_PROD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EA_PROD_SSH_KNOWN_HOSTS }}
          AUTODEPLOY: ${{ vars.EA_PRODUCTION_AUTODEPLOY_ENABLED }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?缺少部署地址}" "${SSH_USER:?缺少部署账号}"
          : "${SSH_KEY:?缺少生产部署密钥}" "${SSH_KNOWN_HOSTS:?缺少已核对的主机公钥}"
          current="$(git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1)"
          [[ "$current" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo "main 已前进，本次使用最新提交对应的工作流进行部署。"
            exit 0
          fi
          release_dir="$RUNNER_TEMP/release"
          mkdir -p "$release_dir"
          tar -xzf "$RUNNER_TEMP/release-download/production-release.tar.gz" -C "$release_dir"
          [[ "$(cat "$release_dir/source-revision")" == "$GITHUB_SHA" ]]
          base="$(cat "$release_dir/deployment-base")"
          api="$(sed -n 's/^EA_RELEASE_API_IMAGE=//p' "$release_dir/release.env")"
          web="$(sed -n 's/^EA_RELEASE_WEB_IMAGE=//p' "$release_dir/release.env")"
          umask 077
          ssh_dir="$(mktemp -d)"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > "$ssh_dir/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          ssh_args=(-T -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15
            -o ServerAliveInterval=10 -o ServerAliveCountMax=6
            -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -i "$ssh_dir/key" -l "$SSH_USER")
          printf '%s\n' EA-VERIFY-1 | ssh "${ssh_args[@]}" "$SSH_HOST" verify
          if [[ "$AUTODEPLOY" != true ]]; then
            echo "生产接收端已通过只读检查，等待启用自动部署。"
            exit 0
          fi
          printf '%s\n' EA-DEPLOY-1 "$GITHUB_SHA" "$base" "$api" "$web" \
            | ssh "${ssh_args[@]}" "$SSH_HOST" deploy
