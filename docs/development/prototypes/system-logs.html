<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>系统日志 · 序列</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #19382f;
      --muted: #62736b;
      --green: #187459;
      --green-wash: #e8f1eb;
      --paper: #f4f6f0;
      --line: #dfe7de;
      --white: #fff;
      --danger: #9a422e;
      --danger-wash: #fcf1e9;
      --warning: #795816;
      --warning-wash: #faf2da;
      --mono: "Cascadia Mono", "IBM Plex Mono", Consolas, monospace;
      --sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 14px/1.55 var(--sans); }
    h1, h2, h3, p, dl, dd { margin: 0; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    .shell { display: grid; min-height: 100vh; grid-template-columns: 218px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100dvh; padding: 32px 20px 23px;
      display: flex; flex-direction: column; background: #193a31; color: #ddeadd;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 7px; }
    .brand__mark {
      width: 39px; height: 39px; display: grid; place-items: center; border-radius: 9px;
      background: #d0e3bc; color: #255143; font-size: 26px; line-height: 1;
    }
    .brand strong { font-size: 22px; font-weight: 650; letter-spacing: .12em; }
    .sidebar__space { margin: 34px 0 27px; padding: 11px 13px; border: 1px solid #436253; border-radius: 8px; }
    .sidebar__space small { display: block; color: #a5bbaa; margin-bottom: 3px; }
    .sidebar__items { margin: 0; padding: 0; list-style: none; }
    .sidebar__item { padding: 9px 10px; color: #bdcfc0; }
    .sidebar__item span { display: inline-block; width: 22px; color: #a5c3ad; }
    .sidebar__item--group { margin-top: 9px; color: #eef7e9; }
    .sidebar__current {
      margin-top: 2px; padding: 9px 12px;
      border: 1px solid #557763; border-radius: 7px;
      background: #2b5143; color: #eaf4e3; font-weight: 650;
    }
    .sidebar__current::before {
      content: ""; display: inline-block; vertical-align: 2px;
      width: 6px; height: 6px; margin-right: 9px; border-radius: 50%; background: #b5d5a5;
    }
    .sidebar__role { margin-top: auto; padding: 13px 10px 0; border-top: 1px solid #436253; color: #b6cbbb; font-size: 12px; }
    main { min-width: 0; }
    .topbar {
      min-height: 62px; padding: 0 clamp(22px, 4.2vw, 62px);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-bottom: 1px solid var(--line); background: #fbfcf8; font-size: 12px; color: var(--muted);
    }
    .topbar strong { color: var(--ink); }
    .topbar__slash { margin: 0 7px; color: #84958a; }
    .topbar__demo {
      border: 1px solid #d7e4d7; border-radius: 6px; padding: 4px 9px;
      background: #edf3e8; color: #435c46; white-space: nowrap;
    }
    .content { max-width: 1510px; margin-inline: auto; padding: 34px clamp(22px, 4.2vw, 62px) 35px; }
    .page-heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    h1 { font-size: clamp(30px, 3.1vw, 44px); font-weight: 720; line-height: 1.16; letter-spacing: -.06em; }
    .page-heading p { margin-top: 10px; color: var(--muted); }
    .button {
      min-height: 36px; padding: 7px 12px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid #cadbd0; border-radius: 7px; color: var(--ink); background: var(--white); white-space: nowrap;
    }
    .button:hover:not(:disabled) { border-color: var(--green); background: var(--green-wash); }
    .button:disabled { opacity: .42; }
    .button--primary { background: var(--green); border-color: var(--green); color: var(--white); font-weight: 650; }
    .button--primary:hover:not(:disabled) { color: var(--ink); }
    .summary {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); overflow: clip;
      border: 1px solid var(--line); border-radius: 10px; background: #fbfcf8; margin-bottom: 23px;
    }
    .summary__cell {
      min-width: 0; display: grid; gap: 4px; padding: 12px 17px 13px; text-align: left;
      border: 0; border-bottom: 2px solid transparent; background: none;
    }
    .summary__cell + .summary__cell { border-left: 1px solid var(--line); }
    .summary__cell[aria-pressed="true"] { background: var(--green-wash); border-bottom-color: var(--green); }
    .summary__cell:hover { background: #edf3eb; }
    .summary__cell:focus-visible { outline-offset: -3px; }
    .summary__label { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .summary__value { font: 650 27px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; flex: 0 0 auto; }
    .dot--success { color: #388561; }
    .dot--error { color: #b5553c; }
    .dot--warning { color: #a7802c; }
    .event-list { background: var(--white); border: 1px solid var(--line); border-radius: 11px; overflow: clip; }
    .event-list__heading {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px 12px;
    }
    .event-list__heading h2 { font-size: 17px; }
    .event-list__count { font-size: 12px; color: var(--muted); }
    .filters { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto auto; gap: 8px; padding: 0 18px 15px; }
    .filters input, .filters select {
      min-width: 0; min-height: 37px; border: 1px solid #d7e2da; border-radius: 6px; background: #fcfdfb;
      padding: 5px 9px; font-size: 12px;
    }
    .filters input { width: 100%; padding-left: 31px; }
    .filters input::placeholder { color: #6c7c72; }
    .filters__search { position: relative; min-width: 0; }
    .filters__icon {
      position: absolute; top: 11px; left: 11px; width: 11px; height: 11px; border: 1.5px solid #61796c;
      border-radius: 50%; pointer-events: none;
    }
    .filters__icon::after {
      content: ""; position: absolute; top: 7px; left: 7px; width: 6px; height: 1.5px;
      background: #61796c; transform: rotate(45deg); transform-origin: left center;
    }
    .filters .button { font-size: 12px; }
    table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
    th {
      padding: 10px 12px; font-size: 11px; font-weight: 650; color: #52695c;
      background: #edf2ea; border-block: 1px solid #e3eae1;
    }
    th:first-child, td:first-child { padding-left: 18px; }
    th:nth-child(1) { width: 113px; }
    th:nth-child(2) { width: 121px; }
    th:nth-child(4) { width: 92px; }
    th:nth-child(5) { width: 79px; }
    th:nth-child(6) { width: 142px; }
    td { height: 57px; padding: 7px 12px; border-bottom: 1px solid #edf0eb; }
    td:last-child { padding-right: 18px; }
    tr[data-event] { cursor: pointer; }
    tr[data-event]:hover, tr[data-event]:focus-within { background: #f1f7f1; }
    tbody tr:first-child[data-status="error"] { background: #fffbf6; }
    tbody tr:first-child[data-status="error"]:hover { background: var(--danger-wash); }
    .event-list__time { font: 12px/1.5 var(--mono); white-space: nowrap; }
    .event-list__secondary { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
    .event-list__error-code { font: 11px/1.45 var(--mono); color: var(--danger); overflow-wrap: anywhere; }
    .event-list__event {
      text-align: left; display: block; max-width: 100%; padding: 0; border: 0; background: none;
      font-weight: 650; overflow-wrap: anywhere;
    }
    .event-list__event:hover { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
    .event-list__id { font: 11px/1.5 var(--mono); color: #52685b; white-space: nowrap; }
    .event-list__token { display: block; overflow: hidden; text-overflow: ellipsis; }
    .event-list__arrow { float: right; color: #6f8577; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 5px;
      background: var(--green-wash); color: #246347; font-size: 11px; font-weight: 650; white-space: nowrap;
    }
    .badge--error { color: var(--danger); background: var(--danger-wash); }
    .badge--warning { color: var(--warning); background: var(--warning-wash); }
    .event-list__footer {
      padding: 11px 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
      color: var(--muted); font-size: 12px;
    }
    .pagination { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
    .pagination .button { min-height: 30px; padding: 4px 8px; }
    .empty { text-align: center; padding: 32px 14px; color: var(--muted); }
    .drawer {
      width: min(466px, 100%); height: 100dvh; max-width: none; max-height: none;
      margin: 0 0 0 auto; padding: 0; border: 0; color: var(--ink); background: var(--white);
      box-shadow: -12px 0 40px #19382f24;
    }
    .drawer::backdrop { background: #163a2b50; }
    .drawer[open] { display: flex; flex-direction: column; }
    .drawer__header {
      flex-shrink: 0; padding: 20px 24px 17px; display: flex; align-items: start; justify-content: space-between;
      gap: 12px; border-bottom: 1px solid var(--line); background: #fbfcf8;
    }
    .drawer__breadcrumb { margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .drawer__header h2 { font-size: 22px; line-height: 1.35; letter-spacing: -.035em; }
    .drawer__close { min-width: 34px; min-height: 34px; padding: 0; font-size: 20px; font-weight: 400; }
    .drawer__meta { margin-top: 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; color: var(--muted); font-size: 11px; }
    .drawer__body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 19px 24px 23px; display: grid; align-content: start; gap: 20px; }
    .drawer__body h3 { font-size: 14px; margin-bottom: 10px; }
    .diagnosis { padding: 13px 14px; border: 1px solid #ecdcd0; border-radius: 8px; background: #fff8f0; }
    .diagnosis[data-status="success"] { border-color: #d8e6da; background: #f1f7ee; }
    .diagnosis__code { display: block; margin-top: 3px; color: var(--danger); font: 650 11px/1.5 var(--mono); overflow-wrap: anywhere; }
    .diagnosis__description { margin-top: 5px; font-size: 12px; color: #576258; }
    .diagnosis__metrics {
      display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 8px; margin-top: 12px;
      padding-top: 10px; border-top: 1px solid #eaddd3;
    }
    .diagnosis__metrics dt { color: var(--muted); font-size: 11px; }
    .diagnosis__metrics dd { margin-top: 2px; font-size: 13px; font-weight: 650; overflow-wrap: anywhere; }
    .timeline { list-style: none; margin: 0 0 0 4px; padding: 0 0 0 12px; border-left: 1px solid #d7e4da; }
    .timeline li { position: relative; padding: 0 0 12px; }
    .timeline li:last-child { padding-bottom: 0; }
    .timeline li::before {
      content: ""; position: absolute; top: 6px; left: -16px; width: 7px; height: 7px;
      border: 1px solid #6b967c; border-radius: 50%; background: var(--white);
    }
    .timeline li[data-status="error"]::before { background: #b5553c; border-color: #b5553c; }
    .timeline__row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12px; }
    .timeline__time { font: 11px/1.5 var(--mono); color: var(--muted); white-space: nowrap; }
    .timeline p { margin-top: 1px; color: var(--muted); font-size: 11px; overflow-wrap: anywhere; }
    .identifiers { display: grid; gap: 6px; }
    .identifiers div { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 8px; align-items: baseline; }
    .identifiers dt { color: var(--muted); font-size: 11px; }
    .identifiers dd { font: 11px/1.45 var(--mono); overflow-wrap: anywhere; }
    .drawer__footer {
      flex-shrink: 0; padding: 12px 24px; display: flex; flex-wrap: wrap; justify-content: flex-end;
      align-items: center; gap: 8px; background: #fbfcf8; border-top: 1px solid var(--line);
    }
    .drawer__feedback { margin-right: auto; color: var(--green); font-size: 11px; }
    .drawer__feedback:empty { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    @media (max-width: 1170px) {
      .shell { grid-template-columns: 184px minmax(0, 1fr); }
      .content, .topbar { padding-inline: 25px; }
      th:nth-child(1) { width: 95px; }
      th:nth-child(2) { width: 101px; }
      th:nth-child(4) { width: 75px; }
      th:nth-child(5) { width: 62px; }
      th:nth-child(6) { width: 114px; }
    }
    @media (max-width: 920px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .sidebar { display: none; }
    }
    @media (max-width: 620px) {
      .content, .topbar { padding-inline: 15px; }
      .content { padding-top: 24px; }
      .page-heading { align-items: flex-start; flex-direction: column; gap: 12px; margin-bottom: 18px; }
      .page-heading p { font-size: 13px; }
      .summary__cell { padding-inline: 10px; }
      .summary__value { font-size: 23px; }
      .summary { margin-bottom: 16px; }
      .filters { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      .filters__search { grid-column: 1 / -1; }
      .event-list__heading, .filters, .event-list__footer { padding-inline: 12px; }
      thead { display: none; }
      tbody, tr, td { display: block; }
      tr[data-event] { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; border-bottom: 1px solid var(--line); padding: 10px 12px; }
      tr[data-event] td { height: auto; padding: 0; border: 0; }
      tr[data-event] td:nth-child(1) { grid-area: 2 / 1; display: flex; gap: 6px; align-items: center; }
      tr[data-event] td:nth-child(1) .event-list__secondary { margin: 0; }
      tr[data-event] td:nth-child(2) { grid-area: 3 / 1; font-size: 12px; }
      tr[data-event] td:nth-child(2) .event-list__secondary { display: inline; margin-left: 6px; }
      tr[data-event] td:nth-child(3) { grid-area: 1 / 1; }
      tr[data-event] td:nth-child(4) { grid-area: 1 / 2; justify-self: end; }
      tr[data-event] td:nth-child(5) { grid-area: 2 / 2; justify-self: end; }
      tr[data-event] td:nth-child(6) { grid-area: 3 / 2; justify-self: end; }
      .event-list__arrow { display: none; }
      .drawer__header, .drawer__body, .drawer__footer { padding-inline: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" aria-label="工作台位置">
      <div class="brand"><span class="brand__mark" aria-hidden="true">≋</span><strong>序列</strong></div>
      <div class="sidebar__space"><small>工作空间</small>默认工作空间</div>
      <ul class="sidebar__items">
        <li class="sidebar__item"><span aria-hidden="true">↗</span>问答工作台</li>
        <li class="sidebar__item"><span aria-hidden="true">◎</span>Agent 管理</li>
        <li class="sidebar__item"><span aria-hidden="true">✦</span>能力中心</li>
        <li class="sidebar__item"><span aria-hidden="true">▤</span>知识库</li>
        <li class="sidebar__item"><span aria-hidden="true">◷</span>定时任务</li>
        <li class="sidebar__item"><span aria-hidden="true">◇</span>系统概览</li>
        <li class="sidebar__item sidebar__item--group"><span aria-hidden="true">⚙</span>后台管理</li>
        <li class="sidebar__current" aria-current="page">系统日志</li>
      </ul>
      <p class="sidebar__role">管理员 · 默认工作空间</p>
    </aside>
    <main>
      <div class="topbar">
        <p>后台管理 <span class="topbar__slash" aria-hidden="true">/</span> <strong>系统日志</strong></p>
        <span class="topbar__demo">演示数据</span>
      </div>
      <div class="content">
        <header class="page-heading">
          <div>
            <h1>系统日志</h1>
            <p>查询工作空间的运行事件，定位请求、模型和连接器故障。</p>
          </div>
          <button class="button" id="show-demo" type="button">查看 ima 故障示例 <span aria-hidden="true">↗</span></button>
        </header>
        <div class="summary" role="group" aria-label="按结果快速筛选">
          <button type="button" class="summary__cell" data-filter="all" aria-pressed="true">
            <span class="summary__label"><span class="dot"></span>全部事件</span><strong class="summary__value">—</strong>
          </button>
          <button type="button" class="summary__cell" data-filter="error" aria-pressed="false">
            <span class="summary__label"><span class="dot dot--error"></span>失败</span><strong class="summary__value">—</strong>
          </button>
          <button type="button" class="summary__cell" data-filter="warning" aria-pressed="false">
            <span class="summary__label"><span class="dot dot--warning"></span>警告</span><strong class="summary__value">—</strong>
          </button>
          <button type="button" class="summary__cell" data-filter="success" aria-pressed="false">
            <span class="summary__label"><span class="dot dot--success"></span>成功</span><strong class="summary__value">—</strong>
          </button>
        </div>
        <section class="event-list" aria-labelledby="event-heading">
          <div class="event-list__heading">
            <h2 id="event-heading">事件列表</h2>
            <p class="event-list__count" id="result-count" aria-live="polite"></p>
          </div>
          <div class="filters">
            <label class="filters__search"><span class="sr-only">查询诊断编号或错误码</span>
              <span class="filters__icon" aria-hidden="true"></span>
              <input type="search" id="query" placeholder="搜索诊断编号、Run ID 或错误码" autocomplete="off">
            </label>
            <label><span class="sr-only">时间范围</span>
              <select id="range"><option value="1">最近 24 小时</option><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select>
            </label>
            <label><span class="sr-only">事件来源</span>
              <select id="source">
                <option value="all">全部来源</option><option value="connector">连接器</option><option value="model">模型</option>
                <option value="run">Agent 运行</option><option value="http">HTTP 请求</option>
                <option value="schedule">定时任务</option><option value="wechat">微信</option>
              </select>
            </label>
            <label><span class="sr-only">执行结果</span>
              <select id="outcome">
                <option value="all">全部结果</option><option value="error">失败</option>
                <option value="warning">警告</option><option value="success">成功</option>
              </select>
            </label>
            <button type="button" class="button" id="reset">重置</button>
          </div>
          <table aria-label="诊断事件">
            <thead><tr><th scope="col">时间</th><th scope="col">来源</th><th scope="col">事件</th><th scope="col">结果</th><th scope="col">耗时</th><th scope="col">诊断编号</th></tr></thead>
            <tbody id="event-rows"></tbody>
          </table>
          <div class="event-list__footer">
            <span id="page-range"></span>
            <nav class="pagination" aria-label="事件分页">
              <button type="button" class="button" id="previous">上一页</button>
              <span id="page-number"></span>
              <button type="button" class="button" id="next">下一页</button>
            </nav>
          </div>
        </section>
      </div>
    </main>
  </div>
  <dialog class="drawer" id="details" aria-labelledby="detail-title">
    <header class="drawer__header">
      <div>
        <p class="drawer__breadcrumb" id="detail-source"></p>
        <h2 id="detail-title"></h2>
        <div class="drawer__meta" id="detail-meta"></div>
      </div>
      <button type="button" class="button drawer__close" aria-label="关闭事件详情" id="close-detail" autofocus>×</button>
    </header>
    <div class="drawer__body">
      <section id="detail-diagnosis" class="diagnosis" aria-label="诊断结果"></section>
      <section aria-labelledby="timeline-heading">
        <h3 id="timeline-heading">关联时间线</h3>
        <ol class="timeline" id="timeline"></ol>
      </section>
      <section aria-labelledby="identifiers-heading">
        <h3 id="identifiers-heading">关联标识</h3>
        <dl class="identifiers" id="identifiers"></dl>
      </section>
    </div>
    <footer class="drawer__footer">
      <p class="drawer__feedback" id="copy-feedback" role="status"></p>
      <button type="button" class="button" id="copy-id">复制诊断编号</button>
      <button type="button" class="button button--primary" id="filter-related">查看关联事件</button>
    </footer>
  </dialog>
  <script>
    const DAY_MS = 24 * 60 * 60 * 1000
    const PAGE_SIZE = 8
    const DEMO_NOW = Date.parse('2026-11-19T11:30:00+08:00')
    const statuses = { error: '失败', warning: '警告', success: '成功' }
    const sources = { connector: '连接器', model: '模型', run: 'Agent 运行', http: 'HTTP 请求', schedule: '定时任务', wechat: '微信' }
    const imaRun = 'run-demo-000034'
    const imaRequest = 'req-demo-000071'
    const imaTimeline = [
      ['11:24:16.104', '创建问答请求', 'POST /api/conversations/{id}/runs · HTTP 200', 'success'],
      ['11:24:16.178', 'Agent 开始运行', '运行已进入工具调度', 'success'],
      ['11:24:17.302', 'ima 返回知识库列表', 'HTTP 200 · 业务码 0', 'success'],
      ['11:24:17.306', '连接器校验响应失败', 'response_validation · 知识库 ID 字段不匹配', 'error'],
    ]
    const events = [
      {
        id: 'diag-demo-0081', at: '2026-11-19T11:24:17+08:00', source: 'connector', detail: 'ima',
        title: '知识库列表响应解析失败', status: 'error', ms: 704, code: 'CONNECTOR_INVALID_OUTPUT',
        requestId: imaRequest, runId: imaRun, toolId: 'tool-demo-000081', toolName: 'ima__search_knowledge_base',
        summary: '上游已响应，适配器校验失败', description: '知识库列表项缺少适配器预期的 ID 字段。',
        metrics: [['上游 HTTP', '200'], ['业务码', '0'], ['失败阶段', '响应校验']],
        timeline: imaTimeline,
      },
      {

        title: '提交问答请求', status: 'success', ms: 74, requestId: imaRequest, runId: imaRun,
        summary: '请求已受理', description: '已创建运行并交给问答执行器。', timeline: imaTimeline,
      },
      {

        title: '笔记接口连通性检查通过', status: 'success', ms: 386,
        summary: '笔记接口可用', description: '上游接受请求并返回有效结果。', metrics: [['上游 HTTP', '200'], ['业务码', '0']],
      },
      {

        runId: 'run-demo-000032', summary: '模型请求进入重试', description: '此次请求将在等待后重试。',
        metrics: [['上游 HTTP', '429'], ['当前尝试', '1 / 3'], ['等待', '2 秒']],
      },

        summary: '渠道未在时限内确认投递', description: '可按诊断编号查询此次投递。',

        summary: '运行结束', description: '已保存助手回答。',

        title: '新闻热点查询完成', status: 'success', ms: 632, toolId: 'tool-demo-000074',
        summary: '查询成功', description: '适配器已完成响应校验。',
      },
      {

        title: '个人授权需要更新', status: 'warning', ms: 195, code: 'CONNECTOR_NOT_LOGGED_IN',
        summary: '上游未接受当前授权', description: '成员可在自己的连接器账号区更新授权码。',
      },
      {
        id: 'diag-demo-0072', at: '2026-11-19T09:53:26+08:00', source: 'run', detail: '序列助手',
        title: '模型网络请求超时', status: 'error', ms: 120000, code: 'MODEL_TIMEOUT',
        summary: '运行未完成', description: '模型请求超过配置的等待时限。',
      },
      {
        id: 'diag-demo-0071', at: '2026-11-19T09:34:37+08:00', source: 'connector', detail: 'ima',
        title: '知识库名称查询完成', status: 'success', ms: 482,
        summary: '查询成功，零条匹配', description: '接口可用，此次没有匹配的知识库。',
      },
      {
        id: 'diag-demo-0060', at: '2026-11-17T14:28:00+08:00', source: 'http', detail: '权限校验',
        title: '接口请求被拒绝', status: 'warning', ms: 23, code: 'WORKSPACE_ACCESS_DENIED',
        summary: '工作空间权限校验未通过', description: '未执行后续业务操作。',
      },
      {
        id: 'diag-demo-0032', at: '2026-11-05T11:42:51+08:00', source: 'schedule', detail: '定时问答',
        title: '定时问答执行完成', status: 'success', ms: 2710,
        summary: '计划任务执行成功', description: '结果已写入任务所属会话。',
      },
    ]

    const byId = id => document.getElementById(id)
    const range = byId('range')
    const source = byId('source')
    const outcome = byId('outcome')
    const query = byId('query')
    const dialog = byId('details')
    const cards = [...document.querySelectorAll('[data-filter]')]
    let page = 0
    let selected = null
    let opener = null

    function badge(status) {
      return `<span class="badge badge--${status}"><span class="dot"></span>${statuses[status]}</span>`
    }

    function duration(ms) {
      return ms >= 1000 ? (ms / 1000).toFixed(2).replace(/\.?0+$/, '') + ' s' : ms + ' ms'
    }

    function logRow(event) {
      const detail = event.code ? `<span class="event-list__error-code">${event.code}</span>` : ''
      return `<tr data-event="${event.id}" data-status="${event.status}">
        <td><time class="event-list__time" datetime="${event.at}">${event.at.slice(11, 19)}</time><span class="event-list__secondary">${event.at.slice(5, 10)}</span></td>
        <td>${sources[event.source]}<span class="event-list__secondary">${event.detail}</span></td>
        <td><button class="event-list__event" type="button" aria-haspopup="dialog">${event.title}</button>${detail}</td>
        <td>${badge(event.status)}</td>
        <td class="event-list__time">${duration(event.ms)}</td>
        <td class="event-list__id" title="${event.id}"><span class="event-list__arrow" aria-hidden="true">›</span><span class="event-list__token">${event.id}</span></td>
      </tr>`
    }

    function render() {
      const term = query.value.trim().toLowerCase()
      const start = DEMO_NOW - Number(range.value) * DAY_MS
      const eligible = events.filter(event => {
        const filterable = [event.id, event.title, event.detail, event.code, event.requestId, event.runId, event.toolId, event.toolName]
        return Date.parse(event.at) >= start && (source.value === 'all' || source.value === event.source)
          && filterable.some(value => value?.toLowerCase().includes(term))
      })
      for (const card of cards) {
        const filter = card.dataset.filter
        card.setAttribute('aria-pressed', String(filter === outcome.value))
        card.querySelector('.summary__value').textContent = filter === 'all'
          ? eligible.length : eligible.filter(event => event.status === filter).length
      }
      const matches = eligible.filter(event => outcome.value === 'all' || event.status === outcome.value)
      const pageCount = Math.max(1, Math.ceil(matches.length / PAGE_SIZE))
      page = Math.min(page, pageCount - 1)
      const offset = page * PAGE_SIZE
      const pageRows = matches.slice(offset, offset + PAGE_SIZE)
      byId('event-rows').innerHTML = pageRows.length
        ? pageRows.map(logRow).join('') : '<tr><td class="empty" colspan="6">没有符合条件的事件</td></tr>'
      byId('result-count').textContent = matches.length + ' 条事件'
      byId('page-range').textContent = pageRows.length ? `${offset + 1}–${offset + pageRows.length} / ${matches.length} 条` : '0 条'
      byId('page-number').textContent = `${page + 1} / ${pageCount}`
      byId('previous').disabled = page === 0
      byId('next').disabled = page + 1 === pageCount
    }

    function openDetails(event, trigger) {
      selected = event
      opener = trigger
      byId('detail-source').textContent = sources[event.source] + ' / ' + event.detail
      byId('detail-title').textContent = event.title
      byId('detail-meta').innerHTML = badge(event.status) + ' <span>' + event.at.slice(0, 19).replace('T', ' ')
        + ' · ' + duration(event.ms) + '</span>'
      const diagnosis = byId('detail-diagnosis')
      diagnosis.dataset.status = event.status
      diagnosis.innerHTML = `<strong>${event.summary}</strong>
        ${event.code ? `<code class="diagnosis__code">${event.code}</code>` : ''}
        <p class="diagnosis__description">${event.description}</p>
        ${event.metrics ? `<dl class="diagnosis__metrics">${event.metrics.map(([label, value]) =>
          `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')}</dl>` : ''}`
      const timeline = event.timeline ?? [[event.at.slice(11, 19), event.title, event.description, event.status]]
      byId('timeline').innerHTML = timeline.map(([time, label, detail, status]) =>
        `<li data-status="${status}"><div class="timeline__row"><strong>${label}</strong><span class="timeline__time">${time}</span></div><p>${detail}</p></li>`
      ).join('')
      const identifiers = [['诊断编号', event.id], ['请求 ID', event.requestId], ['Run ID', event.runId], ['工具调用 ID', event.toolId]]
      byId('identifiers').innerHTML = identifiers.filter(([, value]) => value)
        .map(([label, value]) => `<div><dt>${label}</dt><dd>${value}</dd></div>`).join('')
      byId('copy-feedback').textContent = ''
      byId('filter-related').hidden = !event.runId && !event.requestId
      dialog.showModal()
      dialog.querySelector('.drawer__body').scrollTop = 0
    }

    function reset() {
      range.value = '1'
      source.value = outcome.value = 'all'
      query.value = ''
      page = 0
    }

    function refreshFilters() {
      page = 0
      render()
    }

    for (const filter of [range, source, outcome]) filter.addEventListener('change', refreshFilters)
    query.addEventListener('input', refreshFilters)
    for (const card of cards) card.addEventListener('click', () => {
      outcome.value = card.dataset.filter
      refreshFilters()
    })
    byId('reset').addEventListener('click', () => { reset(); render() })
    byId('previous').addEventListener('click', () => { page--; render() })
    byId('next').addEventListener('click', () => { page++; render() })
    byId('event-rows').addEventListener('click', event => {
      const row = event.target.closest('tr[data-event]')
      if (row) openDetails(events.find(item => item.id === row.dataset.event), row.querySelector('button'))
    })
    byId('show-demo').addEventListener('click', event => openDetails(events[0], event.currentTarget))
    byId('close-detail').addEventListener('click', () => dialog.close())
    dialog.addEventListener('click', event => { if (event.target === dialog) dialog.close() })
    dialog.addEventListener('close', () => {
      if (opener?.isConnected) opener.focus({ preventScroll: true })
      opener = null
    })
    byId('filter-related').addEventListener('click', () => {
      reset()
      range.value = '30'
      query.value = selected.runId || selected.requestId
      opener = query
      render()
      dialog.close()
    })
    byId('copy-id').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(selected.id)
        byId('copy-feedback').textContent = '诊断编号已复制'
      } catch {
        const field = byId('identifiers').querySelector('dd')
        const selection = window.getSelection()
        const textRange = document.createRange()
        textRange.selectNodeContents(field)
        selection.removeAllRanges()
        selection.addRange(textRange)
        byId('copy-feedback').textContent = '编号已选中，可手动复制'
      }
    })
    render()
  </script>
</body>
